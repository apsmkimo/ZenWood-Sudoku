# Build a debug APK and upload it as a workflow artifact.
#
# Triggers: every push, every pull request, and Actions → Run workflow.
# The debug APK is signed by the runner's ephemeral debug keystore, so it
# installs, but the certificate changes between runs.

name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 22.0 is the action default. Pin a newer sdkmanager
          # so platforms;android-37.2 is in the package index.
          cmdline-tools-version: "16111833"
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0"

      - name: Assemble debug
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        id: apks
        run: |
          set -euo pipefail
          label="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ZenWood-Sudoku-${label}-debug.apk"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenWood-Sudoku-${{ steps.apks.outputs.label }}-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
